# Experiment: trailing stop enabled (asymmetric exit logic)
#
# Hypothesis (from project_strategy_edge_baseline.md 2026-05-20):
# The full cluster of 4 spikes + cost analysis shows every config has
# avg_win ≈ avg_loss (payoff ratios 1.03–1.24) — diagnostic of
# SYMMETRIC exit logic. The fixed-ATR stop doesn't ratchet, the
# time-stop fires on winners and losers alike, the target distance
# feeds back into the entry gate. Without asymmetric exits the
# strategy can only win if raw entries have edge > $1/trade, and
# they don't.
#
# This experiment adds the missing asymmetry: trailing stop with a
# breakeven phase + active-trail phase. Both keyed to entry ATR.
#
# Mechanism (see strategy._update_trailing_stop):
#  • After 0.5 × ATR favorable: move stop to entry_price ("free trade").
#  • After 1.5 × ATR favorable: trail stop at 0.5 × ATR below high
#    water of mid since entry.
#  • Ratchet-only — the stop NEVER moves down.
#
# Expected effect: avg_loss SHRINKS (stops fire closer to BE on trades
# that gain a bit then reverse), avg_win MAY GROW (winners run further
# instead of dying at the time-stop). Payoff ratio should climb past
# the 1.35 needed for breakeven at 42% WR. After realistic costs,
# expectancy should be positive if the lever works.
#
# If post-cost expectancy is still negative, structural fix isn't enough
# → strategic call is signal redesign or deprecate.
#
# Baseline: project_strategy_edge_baseline.md.
# Only the four `trailing_*` knobs differ from sample_config.yaml.
mode: paper

process:
  lock_file: /tmp/trading_bot.lock
  heartbeat_path: /tmp/trading_bot.heartbeat
  kill_switch_path: /tmp/trading_bot.kill

broker:
  base_url: https://paper-api.alpaca.markets
  data_feed: iex
  api_key_env: TEST_ALPACA_API_KEY
  api_secret_env: TEST_ALPACA_API_SECRET
  request_timeout_s: 10.0
  max_retries: 3
  retry_backoff_base_s: 0.5
  retry_backoff_cap_s: 4.0
  order_poll_interval_s: 0.5
  order_poll_timeout_s: 15.0

execution:
  limit_slippage_bps: 8
  disaster_stop_atr_mult: 2.0
  flat_before_close_minutes: 10

sizing:
  enable_compounding: true
  starting_equity: 25000
  position_notional_pct: 0.05
  min_trade_notional: 200
  max_trade_notional: 2500
  max_total_exposure_pct: 0.50
  max_symbol_exposure_pct: 0.10
  drawdown_throttle_levels:
    0.02: 0.75
    0.04: 0.50
    0.06: 0.25
  halt_drawdown_pct: 0.08

risk:
  daily_loss_cap_pct: 0.03
  max_concurrent_positions: 3
  spread_filter_bps: 15
  stale_data_max_age_s: 30
  stale_bar_grace_s: 30
  session_start_utc: "13:35"
  session_end_utc: "19:45"
  loss_cooldown_s: 900
  min_expected_edge_bps: 40
  block_first_minutes: 5
  block_last_minutes: 10
  atr_stop_mult: 1.2

strategy:
  symbols: [AAPL, MSFT]
  entry_tf: "5Min"
  confirm_tf: "15Min"
  trend_tf: "1Hour"
  ema_fast: 20
  ema_slow: 50
  trend_ema: 200
  adx_period: 14
  adx_min: 20
  atr_period: 14
  atr_target_mult: 2.0
  breakout_lookback: 20
  min_bars_entry_tf: 100
  min_bars_confirm_tf: 60
  min_bars_trend_tf: 210
  reentry_cooldown_bars: 6
  max_hold_bars: 24
  tick_interval_s: 10.0
  # --- EXPERIMENT: trailing stop on (baseline had it off / absent) ---
  trailing_stop_enabled: true
  trailing_breakeven_at_atr: 0.5
  trailing_activation_at_atr: 1.5
  trailing_distance_atr: 0.5

persistence:
  state_path: /tmp/state.json
  trade_log_path: /tmp/trades.jsonl
  state_fsync: true
