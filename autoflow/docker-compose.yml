x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoflow}
      POSTGRES_DB: ${POSTGRES_DB:-autoflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoflow}"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autoflow}:${POSTGRES_PASSWORD:-autoflow}@postgres:5432/${POSTGRES_DB:-autoflow}
      ENGINE_VAR_DIR: /engine/var
      ENGINE_CONFIG_PATH: /engine/config/config.paper.yaml
      ENGINE_REPO_DIR: /engine
      TRADING_BOT_SERVICE: trading-bot
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      # Read engine artifacts + write kill-switch file
      - ../:/engine
      # Allow API to control the bot container via docker socket
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: ./web
      args:
        # Baked into the client bundle at build time. Browser uses this to
        # reach the API. Defaults to the local-dev URL; set to "/api" in
        # the .env when deploying behind a reverse proxy on the same origin.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    environment:
      # Public URL the browser uses. Override to "/api" when behind nginx.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server-side (SSR) calls go through the docker network
      API_URL_INTERNAL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"

  trading-bot:
    build:
      context: ../
      dockerfile: autoflow/api/trading-bot.Dockerfile
    restart: "no"  # started/stopped via the API
    profiles: ["bot"]  # opt-in: `docker compose --profile bot up` to include
    logging: *default-logging
    environment:
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET}
    volumes:
      - ../:/engine
    working_dir: /engine
    command: ["python", "run_strategy.py", "--config", "config/config.paper.yaml"]

volumes:
  postgres_data:
